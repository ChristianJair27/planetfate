[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planetfate"
version = "0.1.0"
description = "Which planets survive the death of their star, and where they end up: IFMR, engulfment limits, adiabatic expansion and REBOUND checks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Christian Jair (Kister Space) and Claude"}]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
nbody = ["rebound>=4"]
plots = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[project.scripts]
planetfate = "planetfate.cli:main"

[tool.setuptools.packages.find]
include = ["planetfate*"]

[tool.pytest.ini_options]
markers = ["slow: N-body runs"]
